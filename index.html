<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jemo Diary">
<title>Jemo Diary</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #000; --surface: #1c1c1e; --surface2: #2c2c2e; --line: #38383a;
    --text: #f5f5f7; --muted: #98989f; --faint: #6e6e73;
    --accent: #8b5cf6; --accent2: #3b5bdb; --today: #ff453a;
    --grad: linear-gradient(160deg, #c048c0 0%, #6a3fd0 50%, #1f4fbf 100%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { min-height: 100dvh; padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, select { font: inherit; }

  header.top { position: sticky; top: 0; z-index: 5; background: rgba(0,0,0,.86); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
  .pill { background: var(--surface); border-radius: 999px; height: 40px; min-width: 40px; padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .top .logo { width: 36px; height: 36px; flex: none; }
  .top h1 { font-size: 20px; font-weight: 700; margin: 0 auto 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .nav { padding: 0 10px; font-size: 22px; }
  .plus { font-size: 26px; background: var(--grad); }

  main { padding: 0 0 24px; }
  .empty { margin: 48px 24px; text-align: center; color: var(--muted); line-height: 1.5; }
  .empty .big { font-size: 20px; color: var(--text); font-weight: 600; margin-bottom: 8px; }
  .empty .hero { width: 120px; height: 120px; display: block; margin: 0 auto 10px; }
  .empty .name { font-size: 30px; font-weight: 800; color: var(--text); margin-bottom: 18px; letter-spacing: -.01em; }
  .empty .faint { width: 56px; height: 56px; opacity: .35; display: block; margin: 0 auto 10px; }
  .empty button { margin: 6px; }
  .btn { background: var(--surface2); color: var(--text); border-radius: 12px; padding: 12px 16px; font-weight: 600; }
  .btn.primary { background: var(--grad); }

  /* month */
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 4px 6px; color: var(--muted); font-size: 13px; text-align: center; font-weight: 600; }
  .month { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); }
  .cell { min-height: 112px; border-bottom: 1px solid var(--line); padding: 4px 2px; overflow: hidden; text-align: left;
    display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; min-width: 0; }
  .cell.out { opacity: .35; }
  .cell .n { display: block; text-align: center; font-size: 15px; margin-bottom: 4px; }
  .cell.today .n span { background: var(--today); color: #fff; border-radius: 999px; padding: 1px 7px; font-weight: 700; }
  .chip { display: block; font-size: 11px; line-height: 1.25; padding: 2px 4px; margin: 0 1px 2px; border-radius: 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px 2px 0; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 3px; display: block; }
  .more { font-size: 11px; color: var(--muted); text-align: center; }

  /* week */
  .wday { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
  .wday .d { width: 44px; flex: none; text-align: center; }
  .wday .d b { display: block; font-size: 24px; font-weight: 600; }
  .wday .d small { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .wday.today .d b { color: var(--today); }
  .wday .body { flex: 1; min-width: 0; }
  .wev { margin-bottom: 8px; }
  .wev .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wev .t i { font-style: normal; color: var(--muted); font-weight: 400; font-size: 13px; margin-right: 6px; }
  .strip { display: flex; gap: 3px; margin-top: 5px; overflow: hidden; }
  .strip img { width: 46px; height: 46px; object-fit: cover; border-radius: 5px; flex: none; }
  .wday .none { color: var(--faint); font-size: 14px; padding-top: 8px; }

  /* day */
  .daybar { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 8px 8px; text-align: center; }
  .daybar button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; }
  .daybar small { color: var(--muted); font-size: 13px; font-weight: 600; }
  .daybar span { width: 40px; height: 40px; line-height: 40px; border-radius: 999px; font-size: 19px; }
  .daybar .sel span { background: var(--text); color: #000; font-weight: 700; }
  .daybar .today:not(.sel) span { color: var(--today); }
  .daytitle { text-align: center; padding: 10px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-weight: 600; font-size: 17px; }
  .ev { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 22px 12px 4px 8px; }
  .ev .time { color: var(--muted); font-size: 14px; padding-top: 30px; text-align: right; }
  .ev h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .ev .loc { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .ev .acts { display: flex; gap: 8px; margin: 8px 0 10px; }
  .ev .acts button { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--surface); }
  .ev .acts .rep { background: var(--grad); }
  .ev .note { font-size: 15px; line-height: 1.45; color: #d1d1d6; white-space: pre-wrap; margin: 2px 0 8px; padding: 8px 10px; background: var(--surface); border-radius: 10px; }
  .mic { display: inline-flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 999px; padding: 10px 16px; font-weight: 600; margin-top: 10px; }
  .mic .dot { width: 10px; height: 10px; border-radius: 99px; background: var(--today); }
  .mic.on { background: var(--today); color: #fff; }
  .mic.on .dot { background: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; border-top: 1px solid var(--line); padding-top: 8px; }
  .grid3 button { padding: 0; }
  .grid3 img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .nophotos { color: var(--faint); font-size: 14px; padding: 8px 0; border-top: 1px solid var(--line); }

  /* bottom bar */
  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, #000 35%); z-index: 5; }
  .seg { display: flex; background: var(--surface); border-radius: 999px; padding: 4px; }
  .seg button { padding: 8px 14px; border-radius: 999px; font-size: 15px; color: var(--muted); }
  .seg button.on { background: var(--surface2); color: var(--text); font-weight: 600; }

  /* sheets */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 92dvh; overflow: auto; }
  .sheet h2 { margin: 0 0 12px; font-size: 19px; display: flex; align-items: center; gap: 10px; }
  .sheet h2 img { width: 30px; height: 30px; }
  .sheet textarea { width: 100%; min-height: 140px; background: var(--surface2); color: var(--text); border: 0; border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; resize: vertical; }
  .sheet .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .sheet .row small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .sheet .row .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--grad); display: grid; place-items: center; flex: none; }
  .sheet .row.danger { color: var(--today); }
  .sheet label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .sheet input[type=text], .sheet input[type=date], .sheet input[type=time], .sheet select {
    width: 100%; background: var(--surface2); color: var(--text); border: 0; border-radius: 10px; padding: 12px; font-size: 16px; }
  .sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet .chk { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--text); font-size: 15px; }
  .sheet .end { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  .lightbox { position: fixed; inset: 0; background: #000; z-index: 30; display: flex; flex-direction: column; }
  .lightbox .img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox .bar { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  .lightbox .bar .meta { color: var(--muted); font-size: 14px; }
  .lightbox .bar .line { display: flex; gap: 8px; align-items: center; }
  .lightbox select { flex: 1; background: var(--surface2); color: var(--text); border: 0; border-radius: 10px; padding: 10px; }
  .lightbox .close { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 40;
    background: var(--surface2); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); }

  /* report: a white page, printed as-is */
  .report { position: fixed; inset: 0; z-index: 50; background: #e9e9ee; overflow: auto; color: #111; }
  .report .tools { position: sticky; top: 0; display: flex; gap: 8px; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: #e9e9ee; }
  .report .tools > span { display: flex; gap: 8px; }
  .report .tools button { background: #fff; border-radius: 10px; padding: 10px 12px; font-weight: 600; color: #111; white-space: nowrap; font-size: 15px; }
  .report .tools .print { background: var(--grad); color: #fff; }
  .page { background: #fff; max-width: 780px; margin: 0 auto 32px; padding: 36px 32px; }
  .page .brand { display: flex; align-items: center; gap: 10px; color: #6a3fd0; font-weight: 800; font-size: 18px; }
  .page .brand small { display: block; color: #8e8e93; font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
  .page .brand img { width: 46px; height: 46px; }
  .page .mic { background: #f0eef8; color: #3a2a7a; margin: -10px 0 20px; }
  .page .mic.on { background: var(--today); color: #fff; }
  .page h1 { font-size: 28px; margin: 14px 0 6px; }
  .page .facts { color: #444; font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
  .page .facts b { color: #111; }
  .page .notes { width: 100%; min-height: 70px; border: 1px dashed #bbb; border-radius: 8px; padding: 10px; font: inherit; font-size: 15px; color: #111; margin-bottom: 20px; resize: vertical; }
  .page .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .page figure { margin: 0; break-inside: avoid; }
  .page figure img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border-radius: 4px; }
  .page figcaption { font-size: 12px; color: #666; margin-top: 4px; }
  .page footer { margin-top: 28px; padding-top: 12px; border-top: 1px solid #ddd; font-size: 12px; color: #888; display: flex; align-items: center; gap: 8px; }
  .page footer img { width: 22px; height: 22px; }

  @media print {
    @page { margin: 14mm; }
    body { padding: 0; background: #fff; }
    body > *:not(.report) { display: none !important; }
    .report { position: static; background: #fff; overflow: visible; }
    .report .tools { display: none; }
    .page { padding: 0; margin: 0; max-width: none; }
    .page .notes { border: 0; padding: 0; resize: none; }
    .page .notes:placeholder-shown { display: none; }
    .page .mic { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="logo.png" alt="Jemo Diary">
  <button class="pill nav" data-act="prev" aria-label="Previous">‹</button>
  <h1 id="title"></h1>
  <button class="pill nav" data-act="next" aria-label="Next">›</button>
  <button class="pill plus" data-act="menu" aria-label="Add">+</button>
</header>
<main id="main"></main>
<nav class="bottom">
  <button class="pill" data-act="today">Today</button>
  <div class="seg">
    <button data-view="day">Day</button>
    <button data-view="week">Week</button>
    <button data-view="month">Month</button>
  </div>
</nav>
<input type="file" id="pickPhotos" accept="image/*" multiple hidden>
<input type="file" id="pickIcs" accept=".ics,text/calendar" hidden>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
